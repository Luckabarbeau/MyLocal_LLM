<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; fill: #111; }
      .box { stroke: #2c3e50; stroke-width: 2; rx: 10; ry: 10; }
      .green { fill: #dff2e4; }
      .blue { fill: #dcebfc; }
      .orange { fill: #fcecd6; }
      .red { fill: #f8e0e0; }
      .gray { fill: #eeeeee; }
      .purple { fill: #e8e1f6; }
      .arrow { stroke: #333; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #555; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>

  <text x="30" y="40" class="title">mini-llm-lab: full model pipeline</text>

  <!-- Top row -->
  <rect x="30" y="90" width="180" height="70" class="box green"/>
  <text x="120" y="118" class="label" text-anchor="middle">Raw text</text>
  <text x="120" y="142" class="small" text-anchor="middle">"The fluid velocity ..."</text>

  <rect x="250" y="90" width="180" height="70" class="box blue"/>
  <text x="340" y="118" class="label" text-anchor="middle">Tokenizer</text>
  <text x="340" y="142" class="small" text-anchor="middle">byte-pair encoding (BPE)</text>

  <rect x="470" y="90" width="180" height="70" class="box green"/>
  <text x="560" y="118" class="label" text-anchor="middle">Token IDs</text>
  <text x="560" y="142" class="small" text-anchor="middle">[t0, t1, ..., tT-1]</text>

  <rect x="690" y="90" width="220" height="70" class="box blue"/>
  <text x="800" y="118" class="label" text-anchor="middle">Embedding lookup</text>
  <text x="800" y="142" class="small" text-anchor="middle">matrix E ∈ R^(V × d_model)</text>

  <rect x="950" y="90" width="240" height="70" class="box green"/>
  <text x="1070" y="118" class="label" text-anchor="middle">Embedded sequence</text>
  <text x="1070" y="142" class="small" text-anchor="middle">X0 ∈ R^(B × T × d_model)</text>

  <path d="M210 125 L250 125" class="arrow"/>
  <path d="M430 125 L470 125" class="arrow"/>
  <path d="M650 125 L690 125" class="arrow"/>
  <path d="M910 125 L950 125" class="arrow"/>

  <!-- Transformer block area -->
  <rect x="200" y="220" width="1170" height="360" class="box gray"/>
  <text x="785" y="247" class="title" text-anchor="middle">One Transformer block (repeated L times)</text>

  <!-- Attention branch -->
  <rect x="250" y="285" width="150" height="70" class="box blue"/>
  <text x="325" y="313" class="label" text-anchor="middle">RMSNorm</text>
  <text x="325" y="337" class="small" text-anchor="middle">gain γ1</text>

  <rect x="440" y="285" width="210" height="70" class="box blue"/>
  <text x="545" y="313" class="label" text-anchor="middle">QKV projections</text>
  <text x="545" y="337" class="small" text-anchor="middle">Q=XWQ, K=XWK, V=XWV</text>

  <rect x="690" y="285" width="140" height="70" class="box blue"/>
  <text x="760" y="313" class="label" text-anchor="middle">RoPE</text>
  <text x="760" y="337" class="small" text-anchor="middle">on Q and K</text>

  <rect x="870" y="285" width="240" height="70" class="box blue"/>
  <text x="990" y="307" class="label" text-anchor="middle">Causal GQA attention</text>
  <text x="990" y="331" class="small" text-anchor="middle">softmax(QKᵀ / √dh + M)</text>
  <text x="990" y="350" class="small" text-anchor="middle">context = P V</text>

  <rect x="1150" y="285" width="150" height="70" class="box blue"/>
  <text x="1225" y="313" class="label" text-anchor="middle">Output projection</text>
  <text x="1225" y="337" class="small" text-anchor="middle">A = C WO</text>

  <rect x="1150" y="390" width="150" height="70" class="box red"/>
  <text x="1225" y="418" class="label" text-anchor="middle">Residual add</text>
  <text x="1225" y="442" class="small" text-anchor="middle">X' = X + A</text>

  <path d="M1070 160 L1070 210 L325 210 L325 285" class="arrow"/>
  <path d="M400 320 L440 320" class="arrow"/>
  <path d="M650 320 L690 320" class="arrow"/>
  <path d="M830 320 L870 320" class="arrow"/>
  <path d="M1110 320 L1150 320" class="arrow"/>
  <path d="M1225 355 L1225 390" class="arrow"/>
  <path d="M1060 170 L1060 445 L1150 445" class="thin"/>
  <text x="955" y="467" class="small">residual / skip path</text>

  <!-- FFN branch -->
  <rect x="250" y="485" width="150" height="70" class="box blue"/>
  <text x="325" y="513" class="label" text-anchor="middle">RMSNorm</text>
  <text x="325" y="537" class="small" text-anchor="middle">gain γ2</text>

  <rect x="440" y="485" width="240" height="70" class="box blue"/>
  <text x="560" y="507" class="label" text-anchor="middle">SwiGLU input maps</text>
  <text x="560" y="531" class="small" text-anchor="middle">G = Z Wgate, U = Z Wup</text>

  <rect x="720" y="485" width="190" height="70" class="box blue"/>
  <text x="815" y="513" class="label" text-anchor="middle">Gate and multiply</text>
  <text x="815" y="537" class="small" text-anchor="middle">H = SiLU(G) ⊙ U</text>

  <rect x="950" y="485" width="170" height="70" class="box blue"/>
  <text x="1035" y="513" class="label" text-anchor="middle">Down projection</text>
  <text x="1035" y="537" class="small" text-anchor="middle">F = H Wdown</text>

  <rect x="1150" y="485" width="150" height="70" class="box red"/>
  <text x="1225" y="513" class="label" text-anchor="middle">Residual add</text>
  <text x="1225" y="537" class="small" text-anchor="middle">Y = X' + F</text>

  <path d="M1225 460 L1225 485 L325 485" class="arrow"/>
  <path d="M400 520 L440 520" class="arrow"/>
  <path d="M680 520 L720 520" class="arrow"/>
  <path d="M910 520 L950 520" class="arrow"/>
  <path d="M1120 520 L1150 520" class="arrow"/>
  <path d="M1210 460 L1210 563 L1150 563" class="thin"/>
  <text x="962" y="585" class="small">residual / skip path</text>

  <!-- Final pipeline -->
  <rect x="70" y="660" width="210" height="70" class="box green"/>
  <text x="175" y="688" class="label" text-anchor="middle">Final hidden state</text>
  <text x="175" y="712" class="small" text-anchor="middle">XL</text>

  <rect x="320" y="660" width="150" height="70" class="box blue"/>
  <text x="395" y="688" class="label" text-anchor="middle">Final RMSNorm</text>

  <rect x="510" y="660" width="230" height="70" class="box blue"/>
  <text x="625" y="688" class="label" text-anchor="middle">Language-model head</text>
  <text x="625" y="712" class="small" text-anchor="middle">tied weights Eᵀ</text>

  <rect x="780" y="660" width="200" height="70" class="box green"/>
  <text x="880" y="688" class="label" text-anchor="middle">Logits</text>
  <text x="880" y="712" class="small" text-anchor="middle">R^(B × T × V)</text>

  <rect x="1020" y="660" width="140" height="70" class="box blue"/>
  <text x="1090" y="688" class="label" text-anchor="middle">Softmax</text>

  <rect x="1200" y="660" width="250" height="70" class="box green"/>
  <text x="1325" y="688" class="label" text-anchor="middle">Next-token probabilities</text>
  <text x="1325" y="712" class="small" text-anchor="middle">p(xt+1 | x≤t)</text>

  <path d="M1225 555 L1225 625 L175 625 L175 660" class="arrow"/>
  <path d="M280 695 L320 695" class="arrow"/>
  <path d="M470 695 L510 695" class="arrow"/>
  <path d="M740 695 L780 695" class="arrow"/>
  <path d="M980 695 L1020 695" class="arrow"/>
  <path d="M1160 695 L1200 695" class="arrow"/>

  <!-- Training row -->
  <rect x="690" y="800" width="180" height="70" class="box orange"/>
  <text x="780" y="828" class="label" text-anchor="middle">Cross-entropy loss</text>
  <text x="780" y="852" class="small" text-anchor="middle">compare with shifted targets</text>

  <rect x="910" y="800" width="180" height="70" class="box orange"/>
  <text x="1000" y="828" class="label" text-anchor="middle">Backward pass</text>
  <text x="1000" y="852" class="small" text-anchor="middle">explicit gradients</text>

  <rect x="1130" y="800" width="150" height="70" class="box orange"/>
  <text x="1205" y="828" class="label" text-anchor="middle">AdamW</text>
  <text x="1205" y="852" class="small" text-anchor="middle">optimizer</text>

  <rect x="1320" y="800" width="220" height="70" class="box orange"/>
  <text x="1430" y="826" class="label" text-anchor="middle">Weight update</text>
  <text x="1430" y="846" class="small" text-anchor="middle">E, WQ, WK, WV, WO,</text>
  <text x="1430" y="864" class="small" text-anchor="middle">Wgate, Wup, Wdown, γ</text>

  <path d="M880 730 L880 800 L780 800" class="arrow"/>
  <path d="M870 835 L910 835" class="arrow"/>
  <path d="M1090 835 L1130 835" class="arrow"/>
  <path d="M1280 835 L1320 835" class="arrow"/>

  <!-- Notes -->
  <rect x="70" y="790" width="510" height="95" class="box purple"/>
  <text x="325" y="820" class="label" text-anchor="middle">Future extensions</text>
  <text x="325" y="845" class="small" text-anchor="middle">Mixture of experts (MoE), router, expert diagnostics,</text>
  <text x="325" y="865" class="small" text-anchor="middle">dataset pipeline, key-value cache, sampling and inference</text>
</svg>
