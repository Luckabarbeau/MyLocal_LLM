<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#333"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111} .title{font-size:28px;font-weight:bold}.h{font-size:19px}.s{font-size:15px}
      .box{stroke:#34495e;stroke-width:2;rx:9;ry:9}.data{fill:#dff2e4}.op{fill:#dcebfc}.moe{fill:#e8e1f6}.res{fill:#f8e0e0}.train{fill:#fcecd6}.note{fill:#eeeeee}
      .a{stroke:#333;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.skip{stroke:#666;stroke-width:1.7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="50" y="45" class="title">mini-llm-lab: text to next-token prediction, including dense and MoE Transformer blocks</text>

  <!-- Input -->
  <rect x="50" y="80" width="190" height="65" class="box data"/><text x="145" y="108" text-anchor="middle" class="h">Raw text</text><text x="145" y="132" text-anchor="middle" class="s">"The fluid velocity ..."</text>
  <rect x="285" y="80" width="190" height="65" class="box op"/><text x="380" y="108" text-anchor="middle" class="h">Tokenizer</text><text x="380" y="132" text-anchor="middle" class="s">byte-pair encoding (BPE)</text>
  <rect x="520" y="80" width="170" height="65" class="box data"/><text x="605" y="108" text-anchor="middle" class="h">Token IDs</text><text x="605" y="132" text-anchor="middle" class="s">[t0, ..., tT-1]</text>
  <rect x="735" y="80" width="230" height="65" class="box op"/><text x="850" y="108" text-anchor="middle" class="h">Embedding lookup</text><text x="850" y="132" text-anchor="middle" class="s">E: vocabulary x model dimension</text>
  <rect x="1010" y="80" width="260" height="65" class="box data"/><text x="1140" y="108" text-anchor="middle" class="h">Embedded sequence X0</text><text x="1140" y="132" text-anchor="middle" class="s">B x T x d_model</text>
  <path d="M240 112 H285" class="a"/><path d="M475 112 H520" class="a"/><path d="M690 112 H735" class="a"/><path d="M965 112 H1010" class="a"/>

  <!-- Transformer frame -->
  <rect x="60" y="205" width="1480" height="430" rx="14" ry="14" fill="#f2f2f2" stroke="#555" stroke-width="2"/>
  <text x="800" y="238" text-anchor="middle" class="title">One Transformer block (repeated L times)</text>

  <!-- Attention -->
  <rect x="90" y="275" width="150" height="70" class="box data"/><text x="165" y="304" text-anchor="middle" class="h">Block input X</text><text x="165" y="328" text-anchor="middle" class="s">B x T x d_model</text>
  <rect x="285" y="275" width="150" height="70" class="box op"/><text x="360" y="304" text-anchor="middle" class="h">RMSNorm</text><text x="360" y="328" text-anchor="middle" class="s">normalized Z1</text>
  <rect x="480" y="275" width="210" height="70" class="box op"/><text x="585" y="304" text-anchor="middle" class="h">Q / K / V projections</text><text x="585" y="328" text-anchor="middle" class="s">Z1WQ, Z1WK, Z1WV</text>
  <rect x="735" y="275" width="250" height="70" class="box op"/><text x="860" y="298" text-anchor="middle" class="h">RoPE + causal GQA</text><text x="860" y="323" text-anchor="middle" class="s">P = softmax(QK^T/sqrt(dh) + mask)</text><text x="860" y="342" text-anchor="middle" class="s">context C = P V</text>
  <rect x="1030" y="275" width="170" height="70" class="box op"/><text x="1115" y="304" text-anchor="middle" class="h">Output map</text><text x="1115" y="328" text-anchor="middle" class="s">A = C WO</text>
  <rect x="1245" y="275" width="180" height="70" class="box res"/><text x="1335" y="304" text-anchor="middle" class="h">Residual add</text><text x="1335" y="328" text-anchor="middle" class="s">X' = X + A</text>
  <path d="M240 310 H285" class="a"/><path d="M435 310 H480" class="a"/><path d="M690 310 H735" class="a"/><path d="M985 310 H1030" class="a"/><path d="M1200 310 H1245" class="a"/>
  <path d="M165 345 V370 H1335 V345" class="skip"/><text x="670" y="390" class="s">attention residual / skip path</text>

  <!-- second norm -->
  <rect x="120" y="435" width="185" height="70" class="box op"/><text x="212" y="464" text-anchor="middle" class="h">Second RMSNorm</text><text x="212" y="488" text-anchor="middle" class="s">Z2 = RMSNorm(X')</text>
  <rect x="350" y="435" width="210" height="70" class="box note"/><text x="455" y="464" text-anchor="middle" class="h">Feed-forward choice</text><text x="455" y="488" text-anchor="middle" class="s">dense SwiGLU or sparse MoE</text>
  <path d="M1335 345 V410 H212 V435" class="a"/><path d="M305 470 H350" class="a"/>

  <!-- dense path -->
  <rect x="620" y="405" width="280" height="85" class="box op"/><text x="760" y="434" text-anchor="middle" class="h">Dense SwiGLU</text><text x="760" y="458" text-anchor="middle" class="s">G=Z2Wg, U=Z2Wu</text><text x="760" y="479" text-anchor="middle" class="s">F=(SiLU(G) * U) Wd</text>
  <path d="M560 470 H590 V447 H620" class="a"/>

  <!-- MoE path -->
  <rect x="620" y="525" width="235" height="75" class="box moe"/><text x="737" y="554" text-anchor="middle" class="h">MoE router</text><text x="737" y="580" text-anchor="middle" class="s">r=Z2 WR, p=softmax(r)</text>
  <rect x="895" y="525" width="215" height="75" class="box moe"/><text x="1002" y="554" text-anchor="middle" class="h">Top-k selection</text><text x="1002" y="580" text-anchor="middle" class="s">k=2 of NE=6 experts</text>
  <rect x="1150" y="525" width="245" height="75" class="box moe"/><text x="1272" y="554" text-anchor="middle" class="h">Selected SwiGLU experts</text><text x="1272" y="580" text-anchor="middle" class="s">evaluate only E_e1 and E_e2</text>
  <path d="M560 470 H590 V562 H620" class="a"/><path d="M855 562 H895" class="a"/><path d="M1110 562 H1150" class="a"/>

  <rect x="1450" y="430" width="1" height="1" fill="none"/>
  <rect x="1190" y="405" width="250" height="85" class="box res"/><text x="1315" y="434" text-anchor="middle" class="h">Residual output Y</text><text x="1315" y="458" text-anchor="middle" class="s">dense: X' + F</text><text x="1315" y="479" text-anchor="middle" class="s">MoE: X' + F_MoE</text>
  <path d="M900 447 H1190" class="a"/><path d="M1272 525 V500 H1315 V490" class="a"/>
  <path d="M1335 345 V620 H1315 V490" class="skip"/><text x="1020" y="620" class="s">second residual / skip path</text>

  <!-- Output -->
  <rect x="80" y="700" width="160" height="65" class="box data"/><text x="160" y="729" text-anchor="middle" class="h">Final state XL</text><text x="160" y="752" text-anchor="middle" class="s">B x T x d_model</text>
  <rect x="285" y="700" width="170" height="65" class="box op"/><text x="370" y="738" text-anchor="middle" class="h">Final RMSNorm</text>
  <rect x="500" y="700" width="220" height="65" class="box op"/><text x="610" y="729" text-anchor="middle" class="h">Language-model head</text><text x="610" y="752" text-anchor="middle" class="s">tied embedding matrix E^T</text>
  <rect x="765" y="700" width="170" height="65" class="box data"/><text x="850" y="729" text-anchor="middle" class="h">Logits</text><text x="850" y="752" text-anchor="middle" class="s">B x T x V</text>
  <rect x="980" y="700" width="145" height="65" class="box op"/><text x="1052" y="738" text-anchor="middle" class="h">Softmax</text>
  <rect x="1170" y="700" width="300" height="65" class="box data"/><text x="1320" y="729" text-anchor="middle" class="h">Next-token probabilities</text><text x="1320" y="752" text-anchor="middle" class="s">p(x_(t+1) | x_(&lt;=t))</text>
  <path d="M1315 490 V670 H160 V700" class="a"/><path d="M240 732 H285" class="a"/><path d="M455 732 H500" class="a"/><path d="M720 732 H765" class="a"/><path d="M935 732 H980" class="a"/><path d="M1125 732 H1170" class="a"/>

  <!-- Training -->
  <rect x="420" y="840" width="210" height="65" class="box train"/><text x="525" y="868" text-anchor="middle" class="h">Cross-entropy loss</text><text x="525" y="892" text-anchor="middle" class="s">shifted target tokens</text>
  <rect x="675" y="840" width="190" height="65" class="box train"/><text x="770" y="868" text-anchor="middle" class="h">Backward pass</text><text x="770" y="892" text-anchor="middle" class="s">hand-derived gradients</text>
  <rect x="910" y="840" width="155" height="65" class="box train"/><text x="987" y="868" text-anchor="middle" class="h">AdamW</text><text x="987" y="892" text-anchor="middle" class="s">optimizer</text>
  <rect x="1110" y="840" width="270" height="65" class="box train"/><text x="1245" y="868" text-anchor="middle" class="h">Update explicit matrices</text><text x="1245" y="892" text-anchor="middle" class="s">including router and expert weights</text>
  <path d="M850 765 V815 H525 V840" class="a"/><path d="M630 872 H675" class="a"/><path d="M865 872 H910" class="a"/><path d="M1065 872 H1110" class="a"/>
  <text x="55" y="950" class="s">Important: in a MoE Transformer, attention remains shared. The sparse router replaces the feed-forward branch; it does not select attention heads.</text>
</svg>
