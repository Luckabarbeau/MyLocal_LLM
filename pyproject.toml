[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-llm-lab"
version = "0.1.0"
description = "Explicit NumPy/CuPy LLM implementation with handwritten backward passes."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "ml-dtypes>=0.5",
    "pyarrow>=16.0",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda13x>=14.0",
]

triton-attention = [
    "triton==3.8.0",
]

dev = [
    "pytest>=8.0",
]

streaming = [
    "datasets>=3.0",
]

external = [
    "safetensors>=0.4",
    "huggingface_hub>=0.27",
    "gguf>=0.16",
]

[tool.setuptools.packages.find]
include = ["mini_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "unit: focused numerical, API, and component tests",
    "integration: multi-component training, data, checkpoint, or evaluation tests",
    "gpu: tests that explicitly target CuPy, CUDA, or GPU behavior",
    "slow: audits, benchmarks, production checks, and extended workflows",
]
