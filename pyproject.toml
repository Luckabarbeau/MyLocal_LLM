[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-llm-lab"
version = "0.1.0"
description = "Explicit NumPy/CuPy LLM implementation with handwritten backward passes."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "ml-dtypes>=0.5",
    "pyarrow>=16.0",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda13x>=14.0",
]

dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["mini_llm*"]
